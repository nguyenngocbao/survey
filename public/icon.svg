<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#000000" rx="12"/>
  
  <!-- Blue border frame -->
  <rect x="8" y="8" width="112" height="112" fill="none" stroke="#5B9BD5" stroke-width="6" rx="8"/>
  
  <!-- Atom symbol (red) -->
  <g transform="translate(64, 45)">
    <!-- Center nucleus -->
    <circle cx="0" cy="0" r="4" fill="#E63946"/>
    
    <!-- Electron orbits -->
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="none" stroke="#E63946" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="none" stroke="#E63946" stroke-width="2.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="none" stroke="#E63946" stroke-width="2.5" transform="rotate(120)"/>
    
    <!-- Electrons -->
    <circle cx="20" cy="0" r="3" fill="#E63946"/>
    <circle cx="-10" cy="17" r="3" fill="#E63946"/>
    <circle cx="-10" cy="-17" r="3" fill="#E63946"/>
  </g>
  
  <!-- SP text (red) - larger and bold -->
  <text x="64" y="95" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#E63946" text-anchor="middle">SP</text>
  
  <!-- Blue accent line at bottom -->
  <rect x="35" y="110" width="58" height="4" fill="#5B9BD5" rx="2"/>
</svg>
